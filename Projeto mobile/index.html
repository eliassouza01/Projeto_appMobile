<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início - Meus Remédios</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <span class="greeting">Olá, bom dia!</span>
      <span id="nome_login"><strong></strong></span>
      <div class="avatar">👵</div>
    </header>

    <main class="content">
      <section class="next-dose">
        <span class="badge">PRÓXIMA DOSE DO DIA</span>

        <div class="medicine-title">
          <span class="medicine-dot blue"></span>
          <div>
            <h1>Losartana</h1>
            <p>50mg • 1 Comprimido</p>
          </div>
        </div>

        <div class="dose-time">◷ <strong>Às 08:00</strong></div>

        <button class="confirm">✓ &nbsp; Confirmar que Tomei</button>
      </section>

      <h2>Suas Doses de Hoje</h2>

      <div class="dose-card">
        <span class="time">14:00</span>
        <span class="medicine-dot orange"></span>
        <div class="dose-info">
          <strong>Metformina</strong>
          <small>850mg • Metade do comprimido</small>
        </div>
        <button class="check" aria-label="Confirmar dose"></button>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="index.html">
        <span class="nav-icon">⌂</span>
        <small>Início</small>
      </button>
      <button class="nav-item" data-page="remedios.html">
        <span class="nav-icon">◇</span>
        <small>Remédios</small>
      </button>
      <button class="nav-item">
        <span class="nav-icon">□</span>
        <small>Histórico</small>
      </button>
      <button class="nav-item">
        <span class="nav-icon">🛒</span>
        <small>Compras</small>
      </button>
    </nav>
  </div>

  <script src="./js/script.js"></script>
</body>
</html>
